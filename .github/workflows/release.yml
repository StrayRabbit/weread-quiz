name: release

# 打 v* tag 即自动构建免安装包并发布到 Release。
# 也能手动触发：给一个已存在的 tag 就能把产物补上去。
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "要发布/更新的 tag（例如 v1.0.0）"
        required: true
        type: string

permissions:
  contents: write

jobs:
  build:
    name: 构建免安装包并发布
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - name: 安装 uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: 跑测试
        run: |
          uv sync --extra dev
          uv run pytest -q

      - name: 构建免安装包
        # 脚本自带自检：暂存目录和解压后的副本都要能跑起来。
        run: python tools/build_release.py

      - name: 发布到 Release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/*.zip --clobber
            gh release edit "$TAG" --title "$TAG" --notes-file dist/release-notes.md
          else
            gh release create "$TAG" --title "$TAG" \
              --notes-file dist/release-notes.md dist/*.zip
          fi
